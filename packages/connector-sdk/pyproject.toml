[project]
name = "ryx-connector-sdk"
version = "0.1.0"
description = "RYX Connector SDK — Interfaces standard pour connecteurs DMI"
requires-python = ">=3.12"
dependencies = [
    "ryx-shared>=0.1.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
fhir = ["fhir.resources>=7.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",  # mock httpx
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ryx_connector_sdk"]
