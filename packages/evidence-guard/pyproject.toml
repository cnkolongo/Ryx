[project]
name = "ryx-evidence-guard"
version = "0.1.0"
description = "RYX EvidenceGuard — Policy engine for claim validation"
requires-python = ">=3.12"
dependencies = [
    "ryx-shared>=0.1.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ryx_evidence_guard"]
