[project]
name = "ryx-prediction"
version = "0.1.0"
description = "RYX Prediction Service — Scores longitudinaux 30d/6m/1y/2y"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "ryx-shared>=0.1.0",
    "ryx-evidence-guard>=0.1.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
