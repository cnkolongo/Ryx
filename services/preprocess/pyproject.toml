[project]
name = "ryx-preprocess"
version = "0.1.0"
description = "RYX Preprocess Service — OCR, cleaning, extraction structurée"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "easyocr>=1.7.0",
    "pytesseract>=0.3.10",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.9.0",
    "redis>=5.0.0",
    "minio>=7.2.0",
    "structlog>=24.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "ryx-shared>=0.1.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
