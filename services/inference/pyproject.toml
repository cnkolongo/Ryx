[project]
name = "ryx-inference"
version = "0.1.0"
description = "RYX Inference Service — Pillar-0 + MedGemma runners"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "onnxruntime>=1.18.0",
    "transformers>=4.41.0",
    "torch>=2.3.0",
    "redis>=5.0.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-api>=1.24.0",
    "ryx-shared>=0.1.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
