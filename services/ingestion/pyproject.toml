[project]
name = "ryx-ingestion"
version = "0.1.0"
description = "RYX Ingestion Service — Upload documents, DICOM, connecteurs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "minio>=7.2.0",
    "redis>=5.0.0",
    "magic>=0.4.27",
    "structlog>=24.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "ryx-shared>=0.1.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
